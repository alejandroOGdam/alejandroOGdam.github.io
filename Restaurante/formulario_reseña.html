<!DOCTYPE html>
  <html>
    <head>
      <meta charset="UTF-8">
      <link rel="icon" href="img/mono.jpg" type="x-icon">
        <meta name="author" content="Alejandro">
        <meta name="keywords" content="formulario mensaje">
        <meta name="description" content="formulario">
        <title>Formulario</title>
    </head>
    <body>
        <header><h1>Haganos una Reseña</h1></header>
        <form action="#" method="post">

        <label>Seleccione el plato:</label>
        <br>
        <select name="plato" style="width: 300px;">
            <option value="plato1">Plato 1: Croquetas</option>
            <option value="plato2">Plato 2: Tortilla de patatas</option>
            <option value="plato3">Plato 3: Cachopo</option>

        </select>
        <br><br>

        <label>Nombre de quien realiza la reseña:</label>
        <br>
        <input type="text" name="nombre_autor" placeholder="Su nombre" style="width: 300px;">
        <br><br>

        <label>Reseña del plato:</label>
        <br>
        <textarea name="resena" placeholder="Escriba su opinión sobre el plato..." rows="6" cols="50"></textarea>
        <br><br>

        <input type="submit" value="Enviar Reseña">

    </form>
        <footer>
            <a href="./Restaurante.html">Volver al restaurante</a>
            <br>
            aortgom701@g.educaand.es
        </footer>
    </body>
  </html>
